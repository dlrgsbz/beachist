name: android_test

on:
  pull_request:

jobs:
  determine_changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.changes.outputs.android }}
    steps:
    - uses: dorny/paths-filter@v4
      id: changes
      with:
        filters: |
          android:
            - 'android/**'

  test:
    needs: determine_changes
    if: needs.determine_changes.outputs.changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '17'

      - name: Setup configs
        working-directory: android
        run: |
          echo -e "backendUrl=\"https://example.com\"\ndatabaseName=\"wachmanager-test\"\nprovisioningUrl=\"https://verysecret.lambda-url.eu-central-1.on.aws/\"" > ./project_resources/config.properties

      - name: run tests
        working-directory: android
        # todo: re-add linting
        run: ./gradlew testDebug --continue --stacktrace

  emulator_test:
    needs: determine_changes
    if: needs.determine_changes.outputs.changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup configs
        working-directory: android
        run: |
          echo -e "backendUrl=\"https://example.com\"\ndatabaseName=\"wachmanager-test\"\nprovisioningUrl=\"https://verysecret.lambda-url.eu-central-1.on.aws/\"" > ./project_resources/config.properties

      - name: run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          arch: x86_64
          force-avd-creation: false
          avd-name: ubuntu-avd-x86_64-31
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 720
          disable-animations: true
          api-level: 31
          script: ./gradlew connectedDebugAndroidTest --stacktrace
          working-directory: android
