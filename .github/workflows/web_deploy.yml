name: web_deploy

# Deploys to PROD are decoupled from approval so that a run approved during the
# day is only actually deployed inside the nightly maintenance window (22:00-08:00
# Europe/Berlin).
#
#  * gate   -> runs on push to main, uses the gated PROD environment (Required
#              Reviewers). Once a reviewer approves, it only records the approved
#              commit as "pending" (ref refs/deploy/prod-pending). It does NOT deploy.
#  * deploy -> runs on a schedule inside the maintenance window (and on manual
#              dispatch). It builds and deploys the latest approved-but-not-yet-
#              deployed commit, using the non-gated PROD_DEPLOY environment so that
#              no second approval is required at night.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 22-23 * * *'
      timezone: "Europe/Berlin"
    - cron: '0 0-7 * * *'
      timezone: "Europe/Berlin"
    # The next rules allow all-day deployments outside our season
    - cron: '0 8-21 * 1-4 *'
      timezone: "Europe/Berlin"
    - cron: '0 8-21 * 10-12 *'
      timezone: "Europe/Berlin"
    - cron: '0 8-21 1-10 5 *'
      timezone: "Europe/Berlin"
    - cron: '0 8-21 20-30 9 *'
  workflow_dispatch:

jobs:
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Keep the human PROD approval (Required Reviewers) as the authorization step.
    environment: PROD
    permissions:
      contents: write
    concurrency:
      group: web-deploy-gate
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: mark commit as approved for prod deploy
        run: |
          git push origin ${{ github.sha }}:refs/deploy/prod-pending --force
          echo "Commit ${{ github.sha }} marked as pending for the next deploy window."

  deploy:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Non-gated environment holding the FTP/SFTP secrets so the nightly deploy
    # runs without a second approval. See setup note in this file's PR/description.
    environment: PROD_DEPLOY
    permissions:
      contents: write
    concurrency:
      # Never cancel an in-progress deploy (e.g. when the next hourly cron fires).
      group: web-deploy-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: determine pending commit
        id: pending
        run: |
          pending=$(git ls-remote origin refs/deploy/prod-pending | awk '{print $1}')
          deployed=$(git ls-remote origin refs/deploy/prod-deployed | awk '{print $1}')
          if [ -z "$pending" ]; then
            echo "No commit is pending for deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$pending" = "$deployed" ]; then
            echo "Pending commit $pending is already deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$deployed" ] || ! git cat-file -e "${deployed}^{commit}" 2>/dev/null; then
            echo "No usable previous deployment recorded; composer dependencies will be installed."
            composer_changed=true
          elif [ -n "$(git diff --name-only "$deployed" "$pending" -- backend/composer.json backend/composer.lock)" ]; then
            echo "Composer dependencies changed since last deployment."
            composer_changed=true
          else
            echo "Composer dependencies unchanged since last deployment; skipping composer install."
            composer_changed=false
          fi
          echo "Deploying commit $pending."
          echo "sha=$pending" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "composer_changed=$composer_changed" >> "$GITHUB_OUTPUT"

      - name: checkout pending commit
        if: steps.pending.outputs.deploy == 'true'
        run: git checkout ${{ steps.pending.outputs.sha }}

      - name: Tag release
        if: steps.pending.outputs.deploy == 'true'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ format('web/{0}', github.run_number) }}
          tag_prefix: ''

      - name: install node
        if: steps.pending.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: npm ci
        if: steps.pending.outputs.deploy == 'true'
        run: npm ci
        working-directory: admin

      - name: Set Build Datetime
        run: echo "VITE_BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: npm build
        if: steps.pending.outputs.deploy == 'true'
        env:
          VITE_APP_VERSION: ${{ format('web/{0}', github.run_number) }}
        run: npm run build
        working-directory: admin

      - name: Cache Composer dependencies
        if: steps.pending.outputs.deploy == 'true' && steps.pending.outputs.composer_changed == 'true'
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - name: composer install
        uses: php-actions/composer@v6
        with:
          php_version: 7.4
          version: 1
          working_dir: backend
          dev: no
          args: --optimize-autoloader
        env:
          APP_ENV: prod

      - name: use alpine
        if: steps.pending.outputs.deploy == 'true'
        uses: docker://alpine:latest

      - name: move files around
        if: steps.pending.outputs.deploy == 'true'
        run: |
          mkdir dist
          cp -r admin/build/client/* dist
          cp -r backend/config dist
          cp -r backend/public/* dist
          cp -r backend/src dist
          mkdir dist/var
          cp -r backend/composer.* dist
          cp -r backend/.env dist
          sed -i 's/dirname(__DIR__)/__DIR__/' dist/index.php

      - name: copy composer dependencies
        if: steps.pending.outputs.deploy == 'true' && steps.pending.outputs.composer_changed == 'true'
        run: cp -r backend/vendor dist

      - name: deployment to server
        if: steps.pending.outputs.deploy == 'true'
        uses: tjarksaul/SFTP-Deploy-Action@1f9d3f7e125f06dc57760d081a04bca1d49a6dc1
        with:
          server: '${{ secrets.FTP_SERVER }}'
          username: ${{ secrets.FTP_USERNAME }}
          ssh_private_key: ${{ secrets.SFTP_PRIVATE_KEY }}
          local_path: './dist/'
          remote_path: '${{ secrets.FTP_PATH }}'

      - name: mark commit as deployed
        if: steps.pending.outputs.deploy == 'true'
        run: git push origin ${{ steps.pending.outputs.sha }}:refs/deploy/prod-deployed --force

